[project]
name = "prf-agentic-production-lab"
version = "0.1.0"
description = "PRF Agentic AI — Production Engineering Lab. A load-tested, failure-tested agentic AI platform."
authors = [{ name = "Umesh", email = "umesh836@gmail.com" }]
requires-python = ">=3.12"

dependencies = [
    # --- Web layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Persistence ---
    # asyncpg is the async driver; psycopg is kept for Alembic's sync migration
    # path. Running migrations through a sync driver avoids an event loop inside
    # Alembic's `run_migrations_online`, which is a common source of confusion.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # --- Ephemeral state / coordination ---
    "redis>=5.2",
    # --- Outbound HTTP (tools, LLM providers) ---
    "httpx>=0.28",
    # --- Observability ---
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async — catches blocking calls in async defs
    "S",    # flake8-bandit — security
    "T20",  # flake8-print — no stray print()
    "RUF",
]
ignore = [
    "S101",  # assert is fine — pytest depends on it
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use hardcoded credentials against ephemeral containers and
# bind to all interfaces; neither is a finding in a throwaway test fixture.
"tests/**" = ["S105", "S106", "S104", "S311"]
"alembic/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# SQLAlchemy's declarative machinery and some OTel exporters ship incomplete
# stubs. Silence the import noise rather than weakening `strict` everywhere.
[[tool.mypy.overrides]]
module = ["opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Default run is the offline suite. Anything needing a real Postgres/Redis is
# marked and opted into explicitly, so `pytest` stays fast and hermetic.
addopts = "-m 'not integration and not load' --strict-markers"
markers = [
    "integration: needs a real Postgres/Redis (run with `make test-integration`)",
    "resilience: failure-injection tests — timeouts, retries, breaker states",
    "load: throughput/saturation tests, not run in the default suite",
    "evaluation: AI quality evals, may call a live model",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/__init__.py"]
